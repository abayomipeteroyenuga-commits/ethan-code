<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Young learners coding together</title><desc id="desc">A colourful illustration of four young people learning programming together on laptops in a modern classroom.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d2c62"/><stop offset="1" stop-color="#1479c8"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#132e5b"/><stop offset="1" stop-color="#07162f"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#f4c78f"/><stop offset="1" stop-color="#c9874f"/></linearGradient>
 <linearGradient id="hood" x2="1" y2="1"><stop stop-color="#1269ed"/><stop offset="1" stop-color="#092e8d"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#001432" flood-opacity=".3"/></filter>
 </defs>
 <rect width="1100" height="760" rx="34" fill="url(#bg)"/>
 <circle cx="900" cy="110" r="180" fill="#23b6f2" opacity=".14"/><circle cx="120" cy="580" r="210" fill="#45c9ff" opacity=".1"/>
 <rect x="610" y="65" width="420" height="260" rx="20" fill="#06172e" stroke="#49b9ff" stroke-width="8" filter="url(#shadow)"/>
 <rect x="630" y="85" width="380" height="220" rx="10" fill="url(#screen)"/>
 <g font-family="monospace" font-size="19" font-weight="700">
  <text x="660" y="135" fill="#6ee7ff">function createFuture() {</text><text x="680" y="177" fill="#a5baff">learn("coding");</text><text x="680" y="219" fill="#a5f0c1">build("big ideas");</text><text x="680" y="261" fill="#f4c2ff">return success;</text><text x="660" y="289" fill="#6ee7ff">}</text>
 </g>
 <rect x="65" y="90" width="220" height="220" rx="18" fill="#f4f8ff" opacity=".12"/>
 <rect x="88" y="116" width="175" height="150" rx="10" fill="#dcecff" opacity=".18"/>
