 <path d="M0 610 Q260 555 520 600 T1100 585 V760 H0Z" fill="url(#desk)"/>
 <path d="M0 610 Q260 555 520 600 T1100 585" fill="none" stroke="#ffdbac" stroke-width="10"/>
